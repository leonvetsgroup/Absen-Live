<style>

.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.55}
.note{font-size:13.5px;padding:11px 13px;border-radius:10px;background:var(--data-soft)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.good{background:var(--good-soft)}
.sesi{display:flex;flex-direction:column;gap:6px}

.sesi .no{font-family:var(--display);font-weight:700;width:22px;text-align:center}
details{border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);object-fit:contain;align-self:flex-start}
.done{align-items:flex-start;background:var(--good-soft);border-color:transparent}
